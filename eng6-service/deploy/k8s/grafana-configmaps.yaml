apiVersion: 1
kind: ConfigMap
metadata:
  name: eng6-plan-datasources
  namespace: eng6
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://eng6-prometheus:9090
        isDefault: true
        jsonData:
          timeInterval: 10s
---
apiVersion: 1
kind: ConfigMap
metadata:
  name: eng6-plan-dashboards-provider
  namespace: eng6
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: eng6-plan
        orgId: 1
        folder: 'ENG6'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
