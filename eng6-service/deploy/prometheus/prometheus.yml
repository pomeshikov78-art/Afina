# ═══════════════════════════════════════════════════════════════════════════
# Prometheus: сбор метрик сервиса ENG6-PLAN (ЭТАП 5).
#
# Целевые метрики (см. api/metrics.mjs):
#   eng6_plan_duration_ms        — время расчёта (histogram, мс)
#   eng6_queue_length            — размер очереди (gauge)
#   eng6_queue_wait_ms           — время ожидания в очереди (histogram)
#   eng6_workers_busy / _total   — загрузка пула
#   eng6_http_requests_total     — запросы по эндпоинтам и кодам
#   eng6_plan_total              — расчёты по статусам результата
#   eng6_ratelimited_total       — срабатывания ограничителя частоты
#   eng6_process_memory_rss_bytes— память процесса
#   eng6_plan_graph_nodes/_links — распределение размеров графов
# ═══════════════════════════════════════════════════════════════════════════
global:
  scrape_interval: 10s
  scrape_timeout: 8s
  evaluation_interval: 30s
  external_labels:
    service: eng6-plan
    stage: E6

scrape_configs:
  - job_name: eng6-plan
    metrics_path: /metrics
    scheme: http
    # при включённом ENG6_AUTH_ENABLED метрики остаются открытыми только
    # во внутреннем контуре; для внешнего — добавьте bearer_token_file
    static_configs:
      - targets: ['api:8080']
        labels:
          component: api
          env: production
    # Authorization: Bearer <ключ с правом чтения метрик>
    # bearer_token_file: /etc/prometheus/secret/metrics-token
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

# Правила записи: готовые агрегаты для дашборда и алертов
rule_files:
  - /etc/prometheus/rules/*.yml
