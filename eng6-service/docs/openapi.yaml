          type: string
          enum: [plan_queued, plan_started, plan_finished, plan_failed, plan_rejected,
                 rate_limited, queue_full, memory_backpressure, sync_overloaded,
                 task_cancelled, internal_error]
        mode: { type: string, enum: [sync, async] }
        taskId: { type: string }
        actor: { type: string }
        clientId: { type: string }
        requestId: { type: string }
        inputSha256: { type: string }
        inputBytes: { type: integer }
        sizes: { type: object }
        status: { type: [string, 'null'] }
        computeMs: { type: [number, 'null'] }
        queueWaitMs: { type: [number, 'null'] }
        workerId: { type: [integer, 'null'] }
        resultBytes: { type: [integer, 'null'] }
        httpStatus: { type: [integer, 'null'] }
        code: { type: [string, 'null'] }
        message: { type: [string, 'null'] }
        service: { type: string }
        version: { type: string }
        env: { type: string }
        pid: { type: integer }
