        pool: { type: object }
        rateLimit: { type: object }
        audit: { type: object }
        endpoints: { type: array, items: { type: object } }
        headers: { type: object }
        statuses: { type: array, items: { type: string } }

    Conformance:
      type: object
      properties:
        ok: { type: boolean }
        selfTestTotal: { type: integer, example: 33 }
        selfTestFailed: { type: array, items: { type: object } }
        regressionTotal: { type: integer, example: 5 }
        regressionFailed: { type: array, items: { type: object } }
        regression: { type: array, items: { type: object } }
        coreSha256: { type: string }
        cached: { type: boolean }
        cacheAgeS: { type: integer }

    AuditEntry:
      type: object
      properties:
        ts: { type: string, format: date-time }
