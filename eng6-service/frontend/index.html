<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ENG6 · Визуальный картографический планировщик системы связи</title>
<!--
  Дополнение к ТЗ №1 (ГОСТ 34.602) — модуль «Визуальный картографический планировщик».
  Сборка: scripts/build_frontend.mjs (инлайн CSS + JS + демо-данные расчёта ядра).
  NFR-02: внешние ресурсы не загружаются (default-src 'none'), координаты НЕ
          сохраняются в localStorage/IndexedDB/sessionStorage — только в памяти вкладки.
  NFR-01: рендеринг Canvas2D + батчинг, ≥30 FPS при 1000 тактических знаков (замер в UI).
  NFR-03: координаты хранятся и передаются с точностью 6 знаков после запятой.
-->
<style>/* ═══════════════════════════════════════════════════════════════════════════
   Стили визуального картографического планировщика (Дополнение к ТЗ №1).
   Палитра приведена к изделию comms_planner_v8.0 (тёмная тема, акцент #c93545).
   Внешние шрифты/библиотеки не подключаются (NFR-02, CSP default-src 'none').
   ═══════════════════════════════════════════════════════════════════════════ */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0d0f14; --panel: #151821; --card: #1a1e2a; --card2: #202534;
  --border: #2a2f3f; --border2: #3a4155; --text: #e0e4ec; --dim: #8892a4;
  --accent: #c93545; --accent2: #e85d6f; --green: #3fb950; --yellow: #d29922;
  --blue: #58a6ff; --orange: #f0883e; --purple: #bc8cff; --cyan: #00bcd4;
  --radius: 8px; --topbar-h: 42px; --status-h: 22px;
}
html, body { height: 100%; }
body {
  font-family: "Segoe UI", system-ui, -apple-system, "DejaVu Sans", sans-serif;
  background: var(--bg); color: var(--text); font-size: 13px;
  overflow: hidden; display: flex; flex-direction: column; height: 100vh;
}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
::-webkit-scrollbar-track { background: transparent; }
.hidden { display: none !important; }

/* ── Верхняя панель ─────────────────────────────────────────────────────── */
#topbar {
  display: flex; align-items: center; gap: 6px; padding: 5px 10px;
  background: var(--panel); border-bottom: 1px solid var(--border);
  flex-shrink: 0; z-index: 1200; flex-wrap: wrap; min-height: var(--topbar-h);
}
#topbar h1 { font-size: 14px; font-weight: 700; white-space: nowrap; margin-right: 4px; letter-spacing: .2px; }
#topbar h1 span { color: var(--accent2); margin: 0 2px; }
.tb-group { display: flex; gap: 4px; align-items: center; }
.tb-sep { width: 1px; height: 22px; background: var(--border); margin: 0 3px; }
.tb-lbl { font-size: 10px; color: var(--dim); white-space: nowrap; text-transform: uppercase; letter-spacing: .5px; }
.tb-btn, .btn, select, .tb-inp, input[type="text"], input[type="number"] {
  background: var(--card); border: 1px solid var(--border); color: var(--text);
  padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 11px;
  white-space: nowrap; transition: border-color .12s, color .12s, background .12s; font-family: inherit;
}
.tb-inp, input[type="text"], input[type="number"] { cursor: text; }
.tb-btn:hover, .btn:hover, select:hover { border-color: var(--accent); color: var(--accent2); }
.tb-btn.active, .tb-btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
.tb-btn.accent:hover { background: var(--accent2); color: #fff; }
.tb-btn.tool.active { background: var(--card2); border-color: var(--blue); color: var(--blue); }
select { padding-right: 4px; }
#apiBase { width: 92px; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 10.5px; }
.chip {
  font-size: 10px; padding: 3px 7px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--card); color: var(--dim); white-space: nowrap;
  font-family: ui-monospace, Consolas, monospace;
}
.chip-ok { color: var(--green); border-color: #245c2c; }
.chip-bad { color: var(--accent2); border-color: #5c2430; }
.chip-warn { color: var(--yellow); border-color: #5c4a24; }
.chip-dim { color: var(--dim); }

/* ── Рабочая область: карта 80 % / панель 20 % (FR-UI-01) ──────────────── */
#workspace { display: flex; flex: 1; min-height: 0; }
#mapzone { position: relative; flex: 1 1 80%; min-width: 0; background: #0a0c11; overflow: hidden; }
#mapzone.collapsed { flex-basis: 100%; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
#map.tool-select { cursor: default; }
#map.tool-link { cursor: cell; }
#map.tool-measure { cursor: help; }
#map.dragging { cursor: grabbing; }
#map.dropping { cursor: copy; }

#mapOverlays { position: absolute; inset: 0; pointer-events: none; }
.glass {
  pointer-events: auto; background: rgba(21, 24, 33, .88); border: 1px solid var(--border);
  border-radius: var(--radius); backdrop-filter: blur(4px); padding: 6px 8px;
  box-shadow: 0 4px 16px rgba(0,0,0,.4);
}
#legend { position: absolute; left: 10px; bottom: 32px; font-size: 10.5px; line-height: 1.65; max-width: 230px; }
#legend b { display: block; margin-bottom: 3px; color: var(--dim); font-weight: 600; text-transform: uppercase; font-size: 9.5px; letter-spacing: .5px; }
#legend .lg-row { display: flex; align-items: center; gap: 6px; }
#legend .lg-sw { width: 18px; height: 4px; border-radius: 2px; flex-shrink: 0; }
#legend .lg-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(255,255,255,.25); }
#scaleBar { position: absolute; right: 10px; bottom: 32px; font-size: 10px; font-family: ui-monospace, Consolas, monospace; color: var(--dim); }
#scaleBar .bar { height: 5px; border: 1px solid var(--dim); border-top: none; margin-top: 2px; }
#zoomCtl { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 3px; padding: 4px; }
#zoomCtl button { width: 26px; height: 26px; background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 5px; cursor: pointer; font-size: 14px; line-height: 1; }
#zoomCtl button:hover { border-color: var(--accent); color: var(--accent2); }
#layerCtl { position: absolute; right: 46px; top: 10px; font-size: 10.5px; display: flex; flex-direction: column; gap: 2px; }
#layerCtl label { display: flex; align-items: center; gap: 5px; cursor: pointer; color: var(--dim); }
#layerCtl label:hover { color: var(--text); }
#layerCtl input { accent-color: var(--accent); }
#hint { position: absolute; left: 50%; transform: translateX(-50%); top: 10px; font-size: 11px; color: var(--yellow); display: none; }
#hint.show { display: block; }

#statusbar {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--status-h);
  display: flex; align-items: center; gap: 14px; padding: 0 10px;
  background: rgba(21,24,33,.95); border-top: 1px solid var(--border);
  font-size: 10px; color: var(--dim); font-family: ui-monospace, Consolas, monospace; z-index: 5;
}
#statusbar span { white-space: nowrap; }
#sbMsg { margin-left: auto; color: var(--text); }

/* ── Правая панель (FR-UI-01, FR-RES-01…04) ────────────────────────────── */
#rightpanel {
  flex: 0 0 20%; min-width: 280px; max-width: 460px; display: flex; flex-direction: column;
  background: var(--panel); border-left: 1px solid var(--border); min-height: 0;
}
#rightpanel.collapsed { display: none; }
#rpTabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.rpt { flex: 1; background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--dim); padding: 8px 4px; cursor: pointer; font-size: 11px; font-family: inherit; }
.rpt:hover { color: var(--text); }
.rpt.active { color: var(--accent2); border-bottom-color: var(--accent); font-weight: 600; }
.rp-body { flex: 1; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.rp-search { padding: 7px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.rp-search input { width: 100%; margin-bottom: 5px; }
.rp-search .filters { display: flex; gap: 4px; }
.rp-search select { flex: 1; font-size: 10.5px; }
.rp-foot { padding: 6px 8px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 8px; font-size: 10px; color: var(--dim); flex-shrink: 0; }
.rp-foot .tb-btn { margin-left: auto; }

/* Дерево ОШС */
.tree { padding: 4px 6px 12px; flex: 1; overflow-y: auto; }
.tnode { user-select: none; }
.trow {
  display: flex; align-items: center; gap: 5px; padding: 3px 4px; border-radius: 5px;
  cursor: pointer; font-size: 11.5px; border: 1px solid transparent;
}
.trow:hover { background: var(--card); border-color: var(--border); }
.trow.selected { background: #243044; border-color: var(--blue); }
.trow.dragging { opacity: .45; }
.trow.unavailable { opacity: .5; }
.tcaret { width: 11px; flex-shrink: 0; text-align: center; color: var(--dim); font-size: 9px; transition: transform .12s; }
.tcaret.open { transform: rotate(90deg); }
.tcaret.leaf { visibility: hidden; }
.ticon { width: 15px; height: 15px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; }
.tname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tmeta { font-size: 9.5px; color: var(--dim); font-family: ui-monospace, Consolas, monospace; }
.tcond { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 0 1px rgba(0,0,0,.4) inset; }
.c-green { background: var(--green); }
.c-yellow { background: var(--yellow); }
.c-red { background: var(--accent); }
.tkids { margin-left: 13px; border-left: 1px dashed var(--border); padding-left: 4px; }
.tgroup-hd { font-size: 9.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--dim); padding: 7px 4px 3px; }

/* Результаты расчёта */
#tab-res { padding: 8px; gap: 10px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 9px; }
.card h3 { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--dim); margin-bottom: 6px; font-weight: 600; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 11px; }
.kv dt { color: var(--dim); }
.kv dd { text-align: right; font-family: ui-monospace, Consolas, monospace; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10.5px; font-weight: 600; border: 1px solid; }
.b-OPTIMAL { color: #7ee2a8; border-color: #245c2c; background: #10241a; }
.b-FEASIBLE { color: var(--green); border-color: #245c2c; background: #10241a; }
.b-PARTIAL { color: var(--yellow); border-color: #5c4a24; background: #241f10; }
.b-INFEASIBLE, .b-ERROR { color: var(--accent2); border-color: #5c2430; background: #241014; }
.b-INVALID { color: var(--orange); border-color: #5c3a24; background: #241a10; }
.b-TIMEOUT { color: var(--purple); border-color: #453a5c; background: #1a1424; }
.grade { font-size: 22px; font-weight: 700; line-height: 1; }
.g-A { color: #7ee2a8; } .g-B { color: var(--green); } .g-C { color: var(--yellow); } .g-D { color: var(--orange); } .g-F { color: var(--accent2); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 10.5px; }
table.tbl th { text-align: left; color: var(--dim); font-weight: 600; border-bottom: 1px solid var(--border); padding: 3px 4px; position: sticky; top: 0; background: var(--card); }
table.tbl td { padding: 3px 4px; border-bottom: 1px solid #22262f; font-family: ui-monospace, Consolas, monospace; }
table.tbl tr:hover td { background: #20252f; }
.num { text-align: right; }
.pill { padding: 1px 6px; border-radius: 8px; font-size: 9.5px; border: 1px solid; }
.p-ok { color: var(--green); border-color: #245c2c; }
.p-part { color: var(--yellow); border-color: #5c4a24; }
.p-rej { color: var(--accent2); border-color: #5c2430; }
.issue { border-left: 3px solid var(--dim); padding: 4px 7px; margin-bottom: 4px; background: var(--card2); border-radius: 0 5px 5px 0; font-size: 11px; }
.issue.crit { border-left-color: var(--accent); }
.issue.warn { border-left-color: var(--yellow); }
.issue.rec { border-left-color: var(--blue); }
.issue.info { border-left-color: var(--dim); }
.issue b { display: block; font-size: 11px; margin-bottom: 1px; }
.issue span { color: var(--dim); font-size: 10.5px; }
.wave { border: 1px solid var(--border); border-radius: 6px; padding: 5px 7px; margin-bottom: 5px; background: var(--card2); }
.wave-hd { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--dim); margin-bottom: 3px; font-family: ui-monospace, Consolas, monospace; }
.wave-items { display: flex; flex-wrap: wrap; gap: 3px; }
.wave-item { font-size: 10px; padding: 1px 6px; border-radius: 8px; background: #263041; border: 1px solid var(--border2); cursor: pointer; }
.wave-item:hover { border-color: var(--blue); }
.bar-bg { height: 5px; background: #22262f; border-radius: 3px; overflow: hidden; margin-top: 3px; }
.bar-fill { height: 100%; background: var(--blue); }
.bar-fill.warn { background: var(--yellow); }
.bar-fill.bad { background: var(--accent); }

/* Журнал */
.loglist { padding: 6px; flex: 1; overflow-y: auto; font-family: ui-monospace, Consolas, monospace; font-size: 10px; }
.logline { padding: 2px 4px; border-bottom: 1px solid #1e222b; display: flex; gap: 6px; }
.logline .lt { color: var(--dim); flex-shrink: 0; }
.logline.err .lm { color: var(--accent2); }
.logline.warn .lm { color: var(--yellow); }
.logline.ok .lm { color: var(--green); }

/* Контекстное меню (FR-CTX-01) */
#ctxmenu {
  position: fixed; z-index: 3000; min-width: 210px; background: var(--panel);
  border: 1px solid var(--border2); border-radius: var(--radius); padding: 4px;
  box-shadow: 0 8px 28px rgba(0,0,0,.6); font-size: 11.5px;
}
#ctxmenu .ctx-hd { padding: 4px 7px 6px; color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid var(--border); margin-bottom: 3px; }
#ctxmenu .ctx-i { padding: 5px 8px; border-radius: 5px; cursor: pointer; display: flex; gap: 7px; align-items: center; }
#ctxmenu .ctx-i:hover { background: var(--card2); color: var(--accent2); }
#ctxmenu .ctx-i.dis { opacity: .4; pointer-events: none; }
#ctxmenu .ctx-sep { height: 1px; background: var(--border); margin: 3px 0; }
#ctxmenu .ctx-k { margin-left: auto; color: var(--dim); font-size: 9.5px; font-family: ui-monospace, Consolas, monospace; }

/* Модальное окно свойств (FR-CTX-02: 3 вкладки) */
#modal { position: fixed; inset: 0; z-index: 2500; background: rgba(5,7,10,.72); display: flex; align-items: center; justify-content: center; }
.modal-card { width: min(760px, 92vw); max-height: 86vh; background: var(--panel); border: 1px solid var(--border2); border-radius: 12px; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.7); overflow: hidden; }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 13px; }
.modal-head button { background: transparent; border: 1px solid var(--border); color: var(--dim); border-radius: 5px; width: 24px; height: 24px; cursor: pointer; }
.modal-head button:hover { color: var(--accent2); border-color: var(--accent); }
.modal-tabs { display: flex; gap: 2px; padding: 6px 10px 0; border-bottom: 1px solid var(--border); }
.modal-tabs button { background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--dim); padding: 6px 10px; cursor: pointer; font-size: 11.5px; font-family: inherit; }
.modal-tabs button.active { color: var(--accent2); border-bottom-color: var(--accent); }
.modal-body { padding: 10px 12px; overflow-y: auto; flex: 1; }
.modal-foot { padding: 8px 12px; border-top: 1px solid var(--border); display: flex; gap: 6px; justify-content: flex-end; align-items: center; }
.modal-foot .spacer { margin-right: auto; color: var(--dim); font-size: 10.5px; }
.frm { display: grid; grid-template-columns: 168px 1fr; gap: 5px 9px; align-items: center; font-size: 11.5px; }
.frm label { color: var(--dim); }
.frm input, .frm select { width: 100%; }
.frm .full { grid-column: 1 / -1; }

/* Тосты */
#toasts { position: fixed; right: 14px; bottom: 34px; z-index: 4000; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.toast { background: var(--panel); border: 1px solid var(--border2); border-left: 3px solid var(--blue); border-radius: 7px; padding: 7px 11px; font-size: 11.5px; max-width: 420px; box-shadow: 0 8px 24px rgba(0,0,0,.5); animation: tin .18s ease-out; }
.toast.ok { border-left-color: var(--green); }
.toast.warn { border-left-color: var(--yellow); }
.toast.err { border-left-color: var(--accent); }
.toast b { display: block; margin-bottom: 1px; }
.toast span { color: var(--dim); font-size: 10.5px; }
@keyframes tin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* «Призрак» при перетаскивании (FR-MAP-02) */
#dragGhost {
  position: fixed; z-index: 5000; pointer-events: none; padding: 4px 8px;
  background: rgba(26,30,42,.94); border: 1px dashed var(--accent2); border-radius: 7px;
  font-size: 11px; display: flex; align-items: center; gap: 6px; transform: translate(12px, 12px);
  box-shadow: 0 6px 20px rgba(0,0,0,.5);
}
#dragGhost canvas { display: block; }
.drop-ok { border-color: var(--green) !important; }
.drop-bad { border-color: var(--accent) !important; }

/* Адаптивность: на узком экране панель становится оверлеем */
@media (max-width: 1080px) {
  #rightpanel { position: absolute; right: 0; top: var(--topbar-h); bottom: 0; z-index: 900; box-shadow: -8px 0 28px rgba(0,0,0,.5); flex-basis: 320px; }
}
</style>
</head>
<body>
<div id="topbar">
  <h1>ENG6<span>·</span>Планировщик связи</h1>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <span class="tb-lbl">Сценарий</span>
    <select id="scenarioSel" title="Демонстрационные сценарии"></select>
    <button class="tb-btn" id="btnNew" title="Очистить рабочее пространство">Новый</button>
    <button class="tb-btn" id="btnImport" title="Загрузить JSON/CSV (FR-UI-01)">Импорт</button>
    <button class="tb-btn" id="btnExport" title="Выгрузить сценарий в JSON">Экспорт</button>
    <input type="file" id="fileInput" accept=".json,.csv,application/json,text/csv" hidden />
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <span class="tb-lbl">Ядро</span>
    <input id="apiBase" class="tb-inp" value="/api/v1" title="Базовый URL API ENG6-PLAN" />
    <button class="tb-btn accent" id="btnCalc" title="POST /plan/sync — быстрый расчёт">▶ Расчёт (sync)</button>
    <button class="tb-btn" id="btnCalcAsync" title="POST /plan/async — тяжёлая задача в очередь">⇶ Очередь (async)</button>
    <select id="physicsSel" title="Режим физики: fast — аналитический, full — ENG6.calcLink с рельефом">
      <option value="auto">physics: auto</option>
      <option value="fast">physics: fast</option>
      <option value="full">physics: full</option>
    </select>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <span class="tb-lbl">Инструмент</span>
    <button class="tb-btn tool active" data-tool="select" title="Выбор и перемещение (V)">⬚ Выбор</button>
    <button class="tb-btn tool" data-tool="link" title="Линия связи: ЛКМ по двум объектам (L)">✎ Линия</button>
    <button class="tb-btn tool" data-tool="node" title="Группировать выделенное в «Узел связи» (FR-MAP-04)">⌘ Узел связи</button>
    <button class="tb-btn tool" data-tool="measure" title="Измерение расстояния (M)">↔ Измерить</button>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <span id="connState" class="chip chip-dim" title="Состояние канала с ядром">ядро: —</span>
    <span id="perfChip" class="chip" title="NFR-01: частота кадров и число знаков">— FPS · 0 зн.</span>
    <button class="tb-btn" id="btnPanel" title="Свернуть/развернуть правую панель (FR-UI-01)">⇥ Панель</button>
    <button class="tb-btn" id="btnHelp" title="Справка и требования ТЗ">?</button>
  </div>
</div>

<div id="workspace">
  <div id="mapzone">
    <canvas id="map"></canvas>
    <div id="mapOverlays">
      <div id="legend" class="glass"></div>
      <div id="scaleBar" class="glass"></div>
      <div id="zoomCtl" class="glass">
        <button data-z="1" title="Приблизить">+</button>
        <button data-z="-1" title="Отдалить">−</button>
        <button data-z="0" title="Вписать все объекты">⤢</button>
      </div>

<script>/* ═══════════════════════════════════════════════════════════════════════════

     §4  Тактические знаки (условные обозначения);
     §5  ОШС-панель и drag-and-drop;
     §6  Взаимодействие (выбор, линия, узел связи, контекстное меню, карточка);

(function () {

  /* ═══ §1. PURE ══════════════════════════════════════════════════════════ */

  const DEG = Math.PI / 180;
  const TILE = 256;
  const MAX_LAT = 85.0511287798;

  /** Web-Mercator: доля мирового размера по X. */
  function lngToWorldX(lng) { return (lng + 180) / 360; }
  function worldXToLng(x) { return x * 360 - 180; }
  function latToWorldY(lat) {
    const l = Math.max(-MAX_LAT, Math.min(MAX_LAT, lat));

   * Проекция «вид ↔ мир». scale = TILE·2^zoom (пикселей на весь мир).

  function project(view, lat, lng) {

    return { lng: worldXToLng((px + view.ox) / s), lat: worldYToLat((py + view.oy) / s) };
  }
  /** Смещения view (ox, oy) для центрирования на (lat, lng) при данном размере окна. */
  function viewOffsets(lat, lng, zoom, w, h) {
    const s = TILE * Math.pow(2, zoom);

  }

  /**
   * Кластеризация сеткой в ЭКРАННЫХ координатах (детерминированная, O(n)).
   * Применяется на уровне UNIT: близко расположенные узлы связи одного
   * подразделения сливаются в знак «Подразделение связи».
   * @param {{x:number,y:number,groupKey:string}[]} items
   * @param {number} cellPx размер ячейки (обычно 64…96 px)
   * @returns {{key:string, items:object[], x:number, y:number}[]}
   */
  function gridCluster(items, cellPx = 72) {
    const map = new Map();
    for (const it of items) {
      const cx = Math.floor(it.x / cellPx);
      const cy = Math.floor(it.y / cellPx);
      const k = `${it.groupKey}|${cx}|${cy}`;
      let c = map.get(k);
      if (!c) { c = { key: k, items: [], sx: 0, sy: 0, groupKey: it.groupKey }; map.set(k, c); }
      c.items.push(it);
      c.sx += it.x; c.sy += it.y;
    }
    const out = [];
    for (const c of map.values()) {
      out.push({ key: c.key, items: c.items, x: c.sx / c.items.length, y: c.sy / c.items.length, groupKey: c.groupKey });
    }
    return out.sort((a, b) => (a.key < b.key ? -1 : 1));
  }

  /**
   * Радиус зоны покрытия узла по активным линиям (км).
   * Берётся максимальная дальность среди его активных линий; если линий нет —
   * оценка по бюджету: r = d·10^((margin − minMargin)/(10·n)), n — показатель
   * log-distance из таблицы CLUTTER ENG6.
   */
  function coverageRadiusKm(node, links, { fallbackKm = 12, n = 3.2 } = {}) {
    let best = 0;
    for (const l of links) {
      if (l.from !== node.id && l.to !== node.id) continue;
      const d = l.distKm || haversineKm(node, l._otherEnd || node);
      if (d > best) best = d;
    }
    if (best > 0) return round6(best * 1.15);
    return fallbackKm;
  }

  /** Цвет линии по запасу, дБ (пороги согласованы с ядром: 3 / 10 / 20 дБ). */
  function linkColorByMargin(marginDb, { rejected = false } = {}) {
    if (rejected) return '#6b4a52';
    if (!Number.isFinite(marginDb)) return '#6b7280';
    if (marginDb >= 20) return '#3fb950';
    if (marginDb >= 10) return '#7ee2a8';
    if (marginDb >= 3) return '#d29922';
    if (marginDb >= 0) return '#f0883e';
    return '#c93545';
  }
  function linkWidthByCapacity(kbps) {
    if (!kbps || kbps <= 0) return 1;
    return Math.max(1, Math.min(6, 1 + Math.log10(1 + kbps) * 0.9));
  }

  /* ── Парсер CSV (импорт исходных данных, FR-UI-01) ──────────────────── */
  /**
   * Разбор CSV с учётом кавычек, разделителя (, ; \t) и заголовка.
   * @returns {{header:string[], rows:string[][]}}
   */
  function parseCsv(text) {
    const src = String(text).replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
    // разделитель определяется по первой НЕПУСТОЙ строке: секции [nodes]/[links]
    // начинаются с перевода строки, иначе детектор видел пустую строку и брал ','
    const firstLine = src.split('\n').find((l) => l.trim() !== '') || '';
    const delim = [',', ';', '\t'].map((d) => ({ d, c: (firstLine.match(new RegExp('\\' + (d === '\t' ? 't' : d), 'g')) || []).length })).sort((a, b) => b.c - a.c)[0].d || ',';
    const rows = [];
    let row = [], field = '', inQ = false;
    for (let i = 0; i < src.length; i++) {
      const ch = src[i];
      if (inQ) {
        if (ch === '"') { if (src[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
        else field += ch;
      } else if (ch === '"') inQ = true;
      else if (ch === delim) { row.push(field); field = ''; }
      else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else field += ch;
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    const clean = rows.filter((r) => r.some((c) => String(c).trim() !== ''));
    if (!clean.length) return { header: [], rows: [] };
    return { header: clean[0].map((h) => h.trim()), rows: clean.slice(1) };
  }

  /**
   * CSV → сценарий. Поддерживаются два листа в одном файле (секции [nodes]/[links])
   * либо плоский список узлов с колонками: id,type,name,lat,lng,parentId,status.
   */
  function csvToScenario(text) {
    const nodes = [], links = [], demands = [];
    const sections = String(text).split(/^\s*\[(nodes|links|demands)\]\s*$/mi);
    const push = (arr, obj) => arr.push(obj);
    if (sections.length >= 3) {
      for (let i = 1; i < sections.length; i += 2) {
        const kind = sections[i].toLowerCase();
        const { header, rows } = parseCsv(sections[i + 1]);
        for (const r of rows) {
          const o = {};
          header.forEach((h, k) => { o[h] = r[k] === undefined ? '' : String(r[k]).trim(); });
          if (kind === 'nodes') push(nodes, normalizeNodeCsv(o));
          else if (kind === 'links') push(links, normalizeLinkCsv(o));
          else push(demands, normalizeDemandCsv(o));
        }
      }
    } else {
      const { header, rows } = parseCsv(text);
      const lower = header.map((h) => h.toLowerCase());
      const isLinks = lower.includes('from') && lower.includes('to');
      for (const r of rows) {
        const o = {};
        header.forEach((h, k) => { o[h] = r[k] === undefined ? '' : String(r[k]).trim(); });
        if (isLinks) push(links, normalizeLinkCsv(o));
        else push(nodes, normalizeNodeCsv(o));
      }
    }
    return { nodes, links, demands };
  }
  /** Секция [demands]: наряды/заявки на каналы связи. */
  function normalizeDemandCsv(o) {
    const g = (names, def) => { for (const n of names) { for (const k of Object.keys(o)) if (k.toLowerCase() === n && o[k] !== '') return o[k]; } return def; };
    return {
      id: String(g(['id', 'номер', 'наряд'], '') || '').trim(),
      from: String(g(['from', 'от', 'источник'], '')).trim(),
      to: String(g(['to', 'до', 'получатель'], '')).trim(),
      rateKbps: numOr(g(['ratekbps', 'скорость', 'полоса', 'kbps'], 16), 16),
      maxDelayMs: numOr(g(['maxdelayms', 'задержка', 'мс'], 250), 250),
      priority: numOr(g(['priority', 'приоритет'], 3), 3),
    };
  }
  /**
   * Числовое поле из CSV. Пустая строка — это «не задано», а НЕ ноль:
   * иначе линии получали bwKhz: 0 / freqMhz: 0 и справедливо браковались
   * валидатором ядра (RANGE). Обнаружено сквозным прогоном CSV-импорта.
   */
  function numOr(v, def) {
    if (v === undefined || v === null) return def;
    const str = String(v).trim();
    if (str === '') return def;
    const n = Number(str.replace(',', '.'));
    return Number.isFinite(n) ? n : def;
  }
  function normalizeNodeCsv(o) {
    const g = (names, def) => { for (const n of names) { for (const k of Object.keys(o)) if (k.toLowerCase() === n && o[k] !== '') return o[k]; } return def; };
    return {
      id: String(g(['id', 'идентификатор', 'name'], '') || '').trim(),
      type: String(g(['type', 'тип'], 'radio')).trim(),
      name: String(g(['label', 'наименование', 'title'], '') || '').trim(),
      lat: round6(numOr(g(['lat', 'широта'], 0), 0)),
      lng: round6(numOr(g(['lng', 'lon', 'долгота'], 0), 0)),
      parentId: g(['parentid', 'parent', 'подчинение'], null) || null,
      status: g(['status', 'состояние'], 'active') || 'active',
      unitId: g(['unitid', 'инвентарный номер', 'инв. №'], null) || null,
    };
  }
  function normalizeLinkCsv(o) {
    const g = (names, def) => { for (const n of names) { for (const k of Object.keys(o)) if (k.toLowerCase() === n && o[k] !== '') return o[k]; } return def; };
    return {
      id: String(g(['id'], '') || '').trim(),
      from: String(g(['from', 'от'], '')).trim(),
      to: String(g(['to', 'до'], '')).trim(),
      type: String(g(['type', 'тип'], 'VHF')).trim(),
      bwKhz: numOr(g(['bwkhz', 'полоса'], ''), undefined),
      freqMhz: numOr(g(['freqmhz', 'частота'], ''), undefined),
    };
  }

  /* ── FR-INT-02: формирование JSON-пакета для ядра ───────────────────── */
  const BAND_BY_LINK_TYPE = { HF: 'КВ', VHF: 'УКВ', UHF: 'УКВ', RRL: 'РТ', SAT: 'СПУТНИК', FOC: 'ВОЛС' };
  const LINK_TYPE_BY_BAND = { 'КВ': 'HF', 'УКВ': 'VHF', 'РТ': 'RRL', 'СПУТНИК': 'SAT', 'ВОЛС': 'FOC' };

  /**
   * Собрать запрос ENG6-PLAN из состояния планировщика.
   * Координаты — WGS-84, 6 знаков (NFR-03); параметры антенн/мощностей — из
   * карточки техники; состояние 🔴 исключает размещение (FR-RES-03).
   */
  function buildRequest(state, opts = {}) {
    const nodes = [];
    const links = [];
    const placed = state.objects.filter((o) => o.kind === 'asset' || o.kind === 'nodeGroup');
    for (const o of placed) {
      if (o.kind === 'nodeGroup') {
        // FR-MAP-04: узел связи — единый логический объект; в ядро уходит
        // один узел с параметрами лучшей станции группы
        const members = state.objects.filter((x) => x.kind === 'asset' && x.groupId === o.id);
        const best = members.slice().sort((a, b) => (b.spec?.txPowerDbm || 0) - (a.spec?.txPowerDbm || 0))[0] || null;
        nodes.push(makeNode(o, best ? best.spec : null, { children: members.map((m) => m.id) }));
      } else {
        nodes.push(makeNode(o, o.spec || null, { groupId: o.groupId || null }));
      }
    }
    const idset = new Set(nodes.map((n) => n.id));
    for (const l of state.lines) {
      if (!idset.has(l.from) || !idset.has(l.to)) continue;
      links.push({
        id: l.id,
        from: l.from,
        to: l.to,
        type: l.type || 'VHF',
        bwKhz: l.bwKhz,
        freqMhz: l.freqMhz,
        mod: l.mod,
        fec: l.fec,
        priority: l.priority ?? 2,
        isBackup: !!l.isBackup,
        cost: l.cost,
      });
    }
    // автоматические кандидаты: если линий мало — ядро получит только явные
    const demands = (state.demands || []).map((d, i) => ({
      id: d.id || `q${i + 1}`, from: d.from, to: d.to, rateKbps: d.rateKbps,
      maxDelayMs: d.maxDelayMs, priority: d.priority ?? 3, protected: !!d.protected,
    })).filter((d) => idset.has(d.from) && idset.has(d.to));
    const fleet = state.fleet.map((u) => ({
      unitId: u.unitId, kind: u.kind, nodeType: u.nodeType, condition: u.condition,
      costDeploy: u.costDeploy, deployTimeMin: u.deployTimeMin, powerW: u.powerW, note: u.note || '',
    }));
    return {
      meta: { name: state.meta.name || 'Сценарий планировщика', author: state.meta.author || '', requestId: opts.requestId || null, seed: state.meta.seed ?? 20260116 },
      environment: state.environment,
      topology: { nodes, links },
      demands,
      fleet: fleet.length ? fleet : undefined,
      constraints: { ...state.constraints, physics: opts.physics || state.constraints.physics || 'auto' },
      weights: state.weights,
    };
    function makeNode(o, spec, extra) {
      return {
        id: o.id, type: o.nodeType || (spec && spec.nodeType) || 'radio', name: o.name || o.id,
        lat: round6(o.lat), lng: round6(o.lng), status: o.status || 'active',
        parentId: o.parentId ?? null, unitId: o.unitId ?? null,
        txPowerDbm: spec?.txPowerDbm, txGainDbi: spec?.txGainDbi, rxGainDbi: spec?.rxGainDbi,
        rxSensDbm: spec?.rxSensDbm, antHeightM: spec?.antHeightM, freqMhz: spec?.freqMhz,
        feederLossDb: spec?.feederLossDb, noiseFigureDb: spec?.noiseFigureDb, mobility: spec?.mobility,
        deployTimeMin: spec?.deployTimeMin, costDeploy: spec?.costDeploy, ...extra,
      };
    }
  }

  /**
   * Наложить результат расчёта на состояние: статусы линий, маршруты, покрытие.
   * (FR-INT-03: ядро возвращает данные для отрисовки оверлеев.)
   */
  function applyPlanToState(state, result) {
    state.lastResult = result || null;
    state.linkById = new Map();
    state.nodeById = new Map();
    for (const o of state.objects) state.nodeById.set(o.id, o);
    if (!result || !result.plan) return { applied: 0, rejected: 0 };
    let applied = 0;
    for (const l of result.plan.activeLinks || []) { state.linkById.set(l.id, l); applied++; }
    for (const l of result.plan.rejectedLinks || []) state.linkById.set(l.id, { ...l, rejected: true });
    return { applied, rejected: (result.plan.rejectedLinks || []).length };
  }

  /* ═══ §2. Состояние ════════════════════════════════════════════════════ */

  /**
   * NFR-02: никакой персистенции в браузере. Состояние — только в памяти.
   * (Проверка: tests/unit/frontend_pure.test.mjs сканирует исходник на
   * localStorage/sessionStorage/indexedDB/document.cookie.)
   */
  const state = {
    meta: { name: 'Учебный сценарий: батальонный узел связи', author: 'ENG6-UI', seed: 20260116 },
    environment: {
      terrain: { source: 'synth', amplitudeM: 60 },
      clutterType: 'forest',
      weather: { rainRateMmHr: 0, fogDensity: 0, temperatureC: 15, humidityPercent: 60 },
      ionosphere: { timeOfDay: 12, season: 'equinox', solarActivity: 'medium' },
      miscLossDb: 2,
    },
    constraints: { budget: 1200, minMarginDb: 3, maxDelayMs: 250, maxHops: 8, maxSimultaneousDeploy: 3, reserveFactor: 1.3, requireRedundancy: false, physics: 'auto', quality: 'fast', timeLimitMs: 60000, maxUtilizationPct: 85, crewSpeedKmh: 40 },
    weights: { cost: 0.4, delay: 0.3, survivability: 0.2, margin: 0.1 },
    oushTree: [],     // организационно-штатная структура (FR-RES-01/02)
    fleet: [],        // единицы техники
    objects: [],      // размещённые на карте объекты (FR-MAP-03)
    lines: [],        // линии связи (FR-MAP-06)
    demands: [],      // заявки на ресурсы
    selection: new Set(),
    view: { lat: 55.75, lng: 37.62, zoom: 11, ox: 0, oy: 0 },
    tool: 'select',
    layers: { base: true, coverage: true, links: true, rejected: false, labels: true, grid: true },
    lastResult: null,
    linkById: new Map(),
    nodeById: new Map(),
    task: null,
    log: [],
    seq: { obj: 0, line: 0, grp: 0 },
    dirty: true,
  };

  function invalidate() { state.dirty = true; }
  function nextId(prefix, counter) { state.seq[counter] = (state.seq[counter] || 0) + 1; return `${prefix}-${Date.now().toString(36).slice(-4)}${state.seq[counter].toString(36)}`; }

  function logMsg(level, msg, meta) {
    state.log.unshift({ t: new Date().toLocaleTimeString('ru-RU'), level, msg, meta: meta || null });
    if (state.log.length > 500) state.log.pop();

  /* ═══ §3–§9 реализуются только в браузере ══════════════════════════════ */
  const PURE = {
    lngToWorldX, worldXToLng, latToWorldY, worldYToLat, project, unproject, viewOffsets,
    metersPerPixel, scaleDenominator, haversineKm, centroid, round6, fitBounds,
    GEN, GEN_ZOOM, generalizationLevel, gridCluster, coverageRadiusKm,

  const EXPORT = {

    __testApplyScenario: typeof applyScenarioPayload === 'function' ? (d) => applyScenarioPayload(d) : null,

  if (typeof window !== 'undefined') {

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = EXPORT; // для unit-тестов в Node (без DOM)
    return;
  }

  /* ── дальше — только браузерная часть ───────────────────────────────── */
  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => Array.from(document.querySelectorAll(sel));
  const el = (tag, attrs, children) => {
    const n = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') n.className = v;
      else if (k === 'html') n.innerHTML = v;
      else if (k === 'text') n.textContent = v;
      else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
      else if (v !== null && v !== undefined) n.setAttribute(k, v);
    }
    if (children) for (const c of [].concat(children)) if (c) n.appendChild(c);
    return n;
  };
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const nf = (v, d = 1) => (v === null || v === undefined || !Number.isFinite(v) ? '—' : Number(v).toFixed(d));

  function toast(title, text, kind = 'info', ttl = 5000) {

    $('#toasts').appendChild(t);

  }

  /* ═══ §4. Тактические знаки ════════════════════════════════════════════ */

  const SIGN = {
    cp: { label: 'КП', color: '#58a6ff', shape: 'cp' },
    relay: { label: 'Ретранслятор', color: '#bc8cff', shape: 'relay' },
    radio: { label: 'Радиостанция', color: '#3fb950', shape: 'radio' },
    sat: { label: 'Спутниковая станция', color: '#f0883e', shape: 'sat' },
    observer: { label: 'Наблюдательный пост', color: '#00bcd4', shape: 'observer' },
    ew_jam: { label: 'Источник подавления (РЭБ)', color: '#c93545', shape: 'ew' },
    ew_rlr: { label: 'Радиолокационная разведка', color: '#e85d6f', shape: 'ew' },
    ew_rer: { label: 'Источник обнаружения (РЭР)', color: '#d29922', shape: 'ew' },

  /**
   * Отрисовка тактического знака (упрощённые обозначения в духе
   * ГОСТ 21.205 / военных топографических стандартов — FR-MAP-05).
   * @param {CanvasRenderingContext2D} c
   */
  function drawSign(c, type, x, y, size, opts = {}) {
    const s = SIGN[type] || SIGN.radio;
    const sel = !!opts.selected;
    const cond = opts.condition || 'green';
    const r = size / 2;
    c.save();
    c.translate(x, y);
    if (opts.coverage) {
      c.beginPath(); c.arc(0, 0, opts.coverage, 0, Math.PI * 2);
      c.fillStyle = hexA(s.color, 0.07); c.fill();
      c.strokeStyle = hexA(s.color, 0.35); c.lineWidth = 1; c.setLineDash([4, 4]); c.stroke(); c.setLineDash([]);
    }
    if (sel) {
      c.beginPath(); c.arc(0, 0, r + 6, 0, Math.PI * 2);
      c.strokeStyle = '#58a6ff'; c.lineWidth = 2; c.setLineDash([3, 3]); c.stroke(); c.setLineDash([]);
    }
    c.lineWidth = 1.6;
    c.strokeStyle = opts.dim ? hexA(s.color, 0.5) : s.color;
    c.fillStyle = opts.dim ? 'rgba(20,24,32,0.75)' : 'rgba(18,22,30,0.92)';
    switch (s.shape) {
      case 'cp':
        rect(c, -r, -r * 0.72, r * 2, r * 1.44); c.fill(); c.stroke();
        line(c, -r * 0.45, -r * 0.72, -r * 0.45, r * 0.72); line(c, r * 0.45, -r * 0.72, r * 0.45, r * 0.72);
        c.fillStyle = s.color; c.font = `600 ${Math.max(7, r * 0.62)}px Segoe UI, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText('КП', 0, 0.5);
        break;
      case 'relay':
        rect(c, -r * 0.8, -r * 0.6, r * 1.6, r * 1.2); c.fill(); c.stroke();
        line(c, 0, -r * 0.6, 0, -r * 1.25);
        c.beginPath(); c.moveTo(-r * 0.35, -r * 1.25); c.lineTo(r * 0.35, -r * 1.25); c.lineTo(0, -r * 0.72); c.closePath(); c.stroke();
        break;
      case 'radio':
        c.beginPath(); c.arc(0, 0, r * 0.42, 0, Math.PI * 2); c.fill(); c.stroke();
        for (let i = 1; i <= 2; i++) { c.beginPath(); c.arc(0, 0, r * (0.42 + i * 0.34), -Math.PI * 0.75, -Math.PI * 0.25); c.stroke(); }
        break;
      case 'sat':
        rect(c, -r * 0.42, -r * 0.42, r * 0.84, r * 0.84); c.fill(); c.stroke();
        line(c, -r * 1.05, 0, -r * 0.42, 0); line(c, r * 0.42, 0, r * 1.05, 0);

        break;

        c.beginPath(); c.moveTo(r * 0.1, -r * 0.5); c.lineTo(-r * 0.3, r * 0.05); c.lineTo(r * 0.02, r * 0.05); c.lineTo(-r * 0.15, r * 0.55); c.lineTo(r * 0.35, -r * 0.08); c.lineTo(r * 0.02, -r * 0.08); c.closePath();

        c.beginPath(); c.moveTo(r * 0.18, -r * 0.55); c.lineTo(-r * 0.28, r * 0.06); c.lineTo(r * 0.02, r * 0.06); c.lineTo(-r * 0.18, r * 0.6); c.lineTo(r * 0.34, -r * 0.06); c.lineTo(r * 0.02, -r * 0.06); c.closePath();
        c.fillStyle = s.color; c.fill();
        if (opts.count > 1) {
          c.beginPath(); c.arc(r * 0.92, -r * 0.7, r * 0.4, 0, Math.PI * 2);
          c.fillStyle = '#1a1e2a'; c.fill(); c.strokeStyle = s.color; c.lineWidth = 1.2; c.stroke();
          c.fillStyle = s.color; c.font = `700 ${Math.max(7, r * 0.44)}px Segoe UI, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';

        c.fillStyle = s.color; c.font = `700 ${Math.max(9, r * 0.6)}px Segoe UI, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText(opts.label || `${opts.count || 0}`, 0, -r * 0.1);
        c.font = `${Math.max(7, r * 0.36)}px Segoe UI, sans-serif`;
        c.fillStyle = 'rgba(224,228,236,0.75)';
        c.fillText(opts.sub || 'подразделение', 0, r * 0.42);
        break;
      }

        c.beginPath(); c.arc(0, 0, r * 0.6, 0, Math.PI * 2); c.fill(); c.stroke();
    }
    // индикатор состояния техники (FR-RES-03)
    if (opts.showCondition !== false && cond && cond !== 'n/a') {
      c.beginPath(); c.arc(r * 0.95, r * 0.75, Math.max(2.4, r * 0.19), 0, Math.PI * 2);
      c.fillStyle = COND_COLOR[cond] || COND_COLOR['n/a']; c.fill();
      c.strokeStyle = 'rgba(0,0,0,.55)'; c.lineWidth = 0.8; c.stroke();
    }

    if (opts.badge) {
      c.beginPath(); c.arc(-r * 0.95, r * 0.75, Math.max(2.4, r * 0.19), 0, Math.PI * 2);
      c.fillStyle = opts.badge; c.fill(); c.strokeStyle = 'rgba(0,0,0,.55)'; c.lineWidth = 0.8; c.stroke();
