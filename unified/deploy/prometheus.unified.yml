# unified/deploy/prometheus.unified.yml — единый скрейп совмещённого стека.
global:
  scrape_interval: 10s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: eng6-plan          # вычислительный контур (линия B): /metrics (Prometheus 0.0.4)
    static_configs:
      - targets: ['engine:8080']

  - job_name: afina-platform     # платформа (линия A): /metrics добавлен 26.10.2026
    metrics_path: /metrics       # (правка линии A №2, реестр unified/docs/04_LINE_A_CHANGES.md)
    static_configs:              # afina_up, afina_objects_total, afina_queue_jobs{status},
      - targets: ['platform:8470']  # afina_calcs_total{status}, afina_audit_entries_total
