# unified/deploy/prometheus.unified.yml — единый скрейп совмещённого стека.
global:
  scrape_interval: 10s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: eng6-plan          # вычислительный контур (линия B)
    static_configs:
      - targets: ['engine:8080']

  - job_name: afina-platform     # платформа (линия A): /healthz отдаёт JSON; метрик Prometheus
    metrics_path: /healthz       # в линии A пока нет — скрейп healthz как up-индикатор.
    static_configs:              # TODO(UNIF): добавить /metrics в afina/server (фаза 1).
      - targets: ['platform:8470']
